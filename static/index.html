<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arXiv semantic search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;450&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="wrap">
    <h1>arXiv semantic search</h1>
    <p class="sub" id="sub">Hybrid retrieval (BM25 + dense) over ML paper abstracts.</p>
  </div>
</header>

<main class="wrap">
  <div class="searchbar">
    <input id="q" type="text" placeholder="describe the paper you're looking for…"
           value="adversarial examples fooling image classifiers" autocomplete="off">
    <button id="go">Search</button>
  </div>

  <div class="controls">
    <label class="toggle">
      <input type="checkbox" id="rerank" checked>
      <span>Cross-encoder rerank</span>
      <small>higher quality, ~35× slower</small>
    </label>
    <span style="display:flex;align-items:center;gap:14px">
      <span class="themer" role="group" aria-label="Color theme">
        <button data-theme-set="light">light</button>
        <button data-theme-set="dark">dark</button>
        <button data-theme-set="system">system</button>
      </span>
      <a class="link" href="/dashboard.html">metrics</a>
    </span>
  </div>

  <div id="timing" class="timing hidden"></div>
  <div id="results"></div>
</main>

<script>
const $ = s => document.querySelector(s);

async function search() {
  const q = $("#q").value.trim();
  if (q.length < 2) return;
  const rerank = $("#rerank").checked;
  $("#results").innerHTML = '<p class="muted">searching…</p>';
  $("#timing").classList.add("hidden");

  const t0 = performance.now();
  const r = await fetch(`/search?q=${encodeURIComponent(q)}&k=10&rerank_on=${rerank}`);
  const d = await r.json();
  const wall = Math.round(performance.now() - t0);

  const t = d.timing_ms;
  $("#timing").classList.remove("hidden");
  $("#timing").innerHTML = `
    <span class="${d.cached ? 'chip hit' : 'chip'}">${d.cached ? 'cache hit' : 'cache miss'}</span>
    ${t.retrieve !== undefined ? `<span class="chip">retrieve ${t.retrieve}ms</span>` : ''}
    ${t.rerank !== undefined ? `<span class="chip">rerank ${t.rerank}ms</span>` : ''}
    <span class="chip">server ${t.total}ms</span>
    <span class="chip">round trip ${wall}ms</span>`;

  if (!d.results.length) {
    $("#results").innerHTML = `<p class="muted" style="padding:28px 2px">Nothing in the corpus matches this. Every candidate scored below the relevance floor.</p>`;
    return;
  }
  $("#results").innerHTML = d.results.map((x, i) => `
    <article class="card">
      <div class="rank">${i + 1}</div>
      <div>
        <h3>${mark(x.title, q)}</h3>
        <p>${mark(x.abstract, q)}…</p>
        <div class="meta">${x.id}${x.score !== null ? ` · rerank score ${x.score.toFixed(2)}` : ''}</div>
      </div>
    </article>`).join("");
}

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const STOP = new Set(["the","and","for","with","from","that","this","are","was","how","what",
                      "you","your","its","not","can","use","using","into","over","than"]);
function mark(text, query) {
  const terms = query.toLowerCase().match(/[a-z0-9]{3,}/g) || [];
  const uniq = [...new Set(terms)].filter(t => !STOP.has(t));
  if (!uniq.length) return esc(text);
  const re = new RegExp("\\b(" + uniq.map(t =>
    t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")\\w{0,3}\\b", "gi");
  // Match the raw text and escape each segment, so a term can never land inside
  // an entity that esc() produced (e.g. query "amp" corrupting "&amp;").
  let out = "", last = 0, m;
  while ((m = re.exec(text)) !== null) {
    out += esc(text.slice(last, m.index)) + "<mark>" + esc(m[0]) + "</mark>";
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

function applyTheme(mode) {
  if (mode === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", mode);
  document.querySelectorAll("[data-theme-set]").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.themeSet === mode));
  try { localStorage.setItem("theme", mode); } catch (e) {}
}
document.querySelectorAll("[data-theme-set]").forEach(b =>
  b.onclick = () => applyTheme(b.dataset.themeSet));
let _saved = "system";
try { _saved = localStorage.getItem("theme") || "system"; } catch (e) {}
applyTheme(_saved);

$("#go").onclick = search;
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") search(); });

async function initFromHealth() {
  try {
    const h = await (await fetch("/health")).json();
    document.getElementById("sub").textContent =
      `Hybrid retrieval (BM25 + dense) over ${h.docs.toLocaleString()} ML paper abstracts.`;
    if (!h.rerank_available) {
      const box = document.getElementById("rerank");
      box.checked = false;
      box.disabled = true;
      box.closest(".toggle").querySelector("small").textContent =
        "disabled in production — costs 40x throughput on a 512MB instance";
    }
  } catch (e) { /* non-fatal */ }
}
initFromHealth();
search();
</script>
</body>
</html>
